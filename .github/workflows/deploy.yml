name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    outputs:
      backend_url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io

      - name: Build and push backend image
        run: |
          docker build -t gcr.io/$PROJECT_ID/namma-vote-backend:$GITHUB_SHA backend/
          docker push gcr.io/$PROJECT_ID/namma-vote-backend:$GITHUB_SHA

      - name: Deploy backend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: namma-vote-backend
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/namma-vote-backend:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --port 8080
            --memory 1Gi
            --cpu 1
            --min-instances 0
            --max-instances 10
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
            FIREBASE_SERVICE_ACCOUNT_JSON=${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ALGORITHM=HS256
            JWT_EXPIRE_MINUTES=1440
            ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
            ADMIN_PASSWORD_HASH=${{ secrets.ADMIN_PASSWORD_HASH }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            DEBUG=false

      - name: Print backend URL
        run: echo "Backend deployed to ${{ steps.deploy.outputs.url }}"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io

      - name: Build and push frontend image
        run: |
          docker build -t gcr.io/$PROJECT_ID/namma-vote-frontend:$GITHUB_SHA frontend/
          docker push gcr.io/$PROJECT_ID/namma-vote-frontend:$GITHUB_SHA

      - name: Deploy frontend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: namma-vote-frontend
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/namma-vote-frontend:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --port 8080
            --memory 512Mi
            --cpu 1
            --min-instances 0
            --max-instances 10
          env_vars: |
            BACKEND_URL=${{ needs.deploy-backend.outputs.backend_url }}

      - name: Print frontend URL
        run: echo "Frontend deployed to ${{ steps.deploy.outputs.url }}"
